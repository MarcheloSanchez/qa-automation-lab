target-version = "py311"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "A",   # flake8-builtins
]
ignore = [
    "A003",  # shadowing a builtin (used intentionally in mock server log_message)
]
