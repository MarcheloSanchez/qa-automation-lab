name: Smoke Tests

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Start app
        run: |
          cd app/practice-software-testing
          docker compose up -d
          echo "Waiting for the app to become ready on http://localhost:4200/auth/login ..."
          # Also curl the login route itself (not just /): ng serve
          # JIT-compiles each route lazily on first request, so warm it up
          # here rather than paying that compile time inside the test's
          # own action timeouts.
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4200/auth/login >/dev/null; then
              echo "App is ready."
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time." >&2
          docker compose logs
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          rfbrowser init

      - name: Run smoke tests
        run: |
          robot -d output -i smoke --variable BASE_URL:http://localhost:4200 tests

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: robot-output
          path: output
