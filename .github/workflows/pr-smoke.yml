name: Smoke Tests

on:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Start app
        run: bash scripts/start_app.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt

      - name: Run smoke tests
        run: |
          # REQUIRE_API makes an unreachable API fail the job instead of
          # skipping every test and reporting green.
          robot -d output -i smoke \
            --variable API_BASE_URL:http://localhost:8091 \
            --variable REQUIRE_API:true \
            tests

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-output
          path: output

  ui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Start app (with UI)
        run: bash scripts/start_app.sh
        env:
          WAIT_FOR_UI: 'true'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          rfbrowser init chromium

      - name: Run UI tests
        run: robot -d output --variable BASE_URL:http://localhost:4200 tests/ui

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: robot-ui-output
          path: output
